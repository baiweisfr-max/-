plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiangqi.tablet'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiangqi.tablet"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Align transitive Kotlin stdlib so jdk7/jdk8 stubs don't clash with the
    // merged classes in kotlin-stdlib 1.8+ (avoids "Duplicate class" build error).
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
